<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careers at Winbridge Tech Ltd</title>
<meta name="description" content="Apply to Winbridge Tech Ltd by email.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1E6E93;
    --green: #2E9B64;
    --green-deep: #1F7A4A;
    --ink: #12303F;
    --muted: #4B6573;
    --line: #D6E3E8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: "Outfit", "Segoe UI", system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
  }

  /* The bridge: two halves slide in from the edges and meet in the middle. */
  .bridge { display: flex; height: 8px; overflow: hidden; }
  .bridge span { flex: 1; }
  .bridge .l { background: var(--blue); animation: fromLeft .9s cubic-bezier(.2,.7,.2,1) both; }
  .bridge .r { background: var(--green); animation: fromRight .9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes fromLeft  { from { transform: translateX(-100%); } }
  @keyframes fromRight { from { transform: translateX(100%); } }

  main {
    max-width: 34rem;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 3rem;
  }
  .logo { display: block; width: min(17rem, 78%); height: auto; margin: 0 0 2.75rem; }

  h1 {
    margin: 0 0 1rem;
    font-weight: 600;
    font-size: clamp(2.1rem, 8vw, 3rem);
    line-height: 1.08;
    letter-spacing: -0.015em;
  }
  .lede { margin: 0 0 2rem; color: var(--muted); max-width: 30rem; }

  .actions { display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1.75rem; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 3.25rem; padding: .75rem 1.25rem;
    border-radius: 10px;
    font: inherit; font-weight: 500; font-size: 1.0625rem;
    text-decoration: none; cursor: pointer;
    border: 2px solid transparent;
  }
  .btn-apply { background: var(--blue); color: #fff; }
  .btn-apply:hover { background: #185A7A; }
  .btn-fb { background: #fff; color: var(--green-deep); border-color: var(--green); }
  .btn-fb:hover { background: #F0F9F4; }
  .btn:focus-visible, .copy:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .address {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem;
    padding: .75rem 1rem;
    border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 2.5rem;
  }
  .address code {
    flex: 1 1 16rem;
    font: inherit; font-size: .98rem; color: var(--ink);
    user-select: all;
  }
  .copy {
    flex: none; padding: .4rem .9rem;
    border: 1px solid var(--blue); border-radius: 8px;
    background: #fff; color: var(--blue);
    font: inherit; font-size: .95rem; font-weight: 500; cursor: pointer;
  }
  .copy:hover { background: #EEF6FA; }

  footer { color: var(--muted); font-size: .95rem; border-top: 1px solid var(--line); padding-top: 1rem; }

  @media (min-width: 40rem) {
    main { padding-top: 4rem; }
    .actions { flex-direction: row; }
    .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bridge .l, .bridge .r { animation: none; }
  }
</style>
</head>
